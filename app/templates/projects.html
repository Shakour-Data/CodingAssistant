{% extends "base.html" %}

{% block title %}Projects{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1><i class="fas fa-folder-open me-2"></i>Projects</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProjectModal">
                    <i class="fas fa-plus me-2"></i>Add Project
                </button>
            </div>

            <div class="row" id="projectsContainer">
                <!-- Projects will be loaded here -->
            </div>
        </div>
    </div>
</div>

<!-- Add Project Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addProjectForm">
                    <div class="mb-3">
                        <label for="projectName" class="form-label">Project Name</label>
                        <input type="text" class="form-control" id="projectName" required>
                    </div>
                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="projectPath" class="form-label">Project Path</label>
                        <input type="text" class="form-control" id="projectPath" required>
                        <div class="form-text">Enter the full path to the project folder</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveProjectBtn">Save Project</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadProjects();

    // Save project
    document.getElementById('saveProjectBtn').addEventListener('click', function() {
        const name = document.getElementById('projectName').value;
        const description = document.getElementById('projectDescription').value;
        const path = document.getElementById('projectPath').value;

        if (!name || !path) {
            alert('Please fill in all required fields');
            return;
        }

        fetch('/api/projects', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                name: name,
                description: description,
                path: path
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('Error: ' + data.error);
            } else {
                bootstrap.Modal.getInstance(document.getElementById('addProjectModal')).hide();
                document.getElementById('addProjectForm').reset();
                loadProjects();
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while saving the project');
        });
    });
});

function loadProjects() {
    fetch('/api/projects')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';

            if (data.projects && data.projects.length > 0) {
                data.projects.forEach(project => {
                    const projectCard = createProjectCard(project);
                    container.appendChild(projectCard);
                });
            } else {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="text-center py-5">
                            <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">No projects found</h4>
                            <p class="text-muted">Add your first project to get started</p>
                        </div>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('Error loading projects:', error);
        });
}

function createProjectCard(project) {
    const col = document.createElement('div');
    col.className = 'col-md-6 col-lg-4 mb-4';

    const statusClass = project.status === 'completed' ? 'success' : project.status === 'in_progress' ? 'warning' : 'danger';
    const statusText = project.status === 'completed' ? 'Completed' : project.status === 'in_progress' ? 'In Progress' : 'Failed';

    col.innerHTML = `
        <div class="card h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title">${project.name}</h5>
                    <span class="badge bg-${statusClass}">${statusText}</span>
                </div>
                <p class="card-text text-muted small">${project.description || 'No description'}</p>
                <div class="mb-3">
                    <small class="text-muted">
                        <i class="fas fa-folder me-1"></i>
                        <span title="${project.path}">${project.path.length > 50 ? project.path.substring(0, 50) + '...' : project.path}</span>
                    </small>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary btn-sm" onclick="openProjectFolder(${project.id})">
                        <i class="fas fa-external-link-alt me-1"></i>Open Folder
                    </button>
                </div>
            </div>
            <div class="card-footer text-muted small">
                Created: ${new Date(project.created_at).toLocaleDateString()}
            </div>
        </div>
    `;

    return col;
}

function openProjectFolder(projectId) {
    fetch(`/api/projects/${projectId}/open`, {
        method: 'POST'
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert('Error: ' + data.error);
        } else {
            // Folder opened successfully
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred while opening the folder');
    });
}
</script>
{% endblock %}
